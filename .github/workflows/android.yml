name: Android app (Google Play)

# Builds the Google Play package (Trusted Web Activity) from android/.
# Run it from the Actions tab ("Run workflow"); it also runs when android/ changes.
#
# Signing — add these repository secrets (Settings → Secrets and variables → Actions):
#   SIGMA_KEYSTORE_BASE64    base64 of the upload keystore file
#   SIGMA_KEYSTORE_PASSWORD  keystore (and key) password
# Without them the build is signed with a throwaway key: fine for testing,
# NOT for uploading to Google Play.

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build signed AAB + APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      SIGMA_VERSION_CODE: ${{ github.run_number }}
      SIGMA_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK platform 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGMA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGMA_KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/upload.keystore"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KS"
            echo "SIGMA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING=upload key" >> "$GITHUB_ENV"
          else
            PW="$(openssl rand -hex 16)"
            echo "::add-mask::$PW"
            keytool -genkeypair -keystore "$KS" -storepass "$PW" -alias sigma-upload \
              -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Sigma test build" -noprompt
            echo "SIGMA_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "SIGNING=throwaway test key (NOT for Google Play)" >> "$GITHUB_ENV"
            echo "::warning::SIGMA_KEYSTORE_BASE64 / SIGMA_KEYSTORE_PASSWORD secrets are not set — built with a throwaway key. Do not upload this build to Google Play."
          fi
          echo "SIGMA_KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "SIGMA_KEY_ALIAS=sigma-upload" >> "$GITHUB_ENV"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease

      - name: Summary
        run: |
          FP=$(keytool -list -v -keystore "$SIGMA_KEYSTORE_FILE" -storepass "$SIGMA_KEYSTORE_PASSWORD" -alias sigma-upload | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')
          {
            echo "## Sigma Android build ${SIGMA_VERSION_NAME} (versionCode ${SIGMA_VERSION_CODE})"
            echo ""
            echo "- Signed with: **${SIGNING}**"
            echo "- Signing certificate SHA-256: \`${FP}\`"
            echo "- Download the **sigma-android** artifact below: \`app-release.aab\` (upload to Google Play) and \`app-release.apk\` (install directly to test)."
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p ../out
          cp app/build/outputs/bundle/release/app-release.aab ../out/sigma-${SIGMA_VERSION_NAME}.aab
          cp app/build/outputs/apk/release/app-release.apk ../out/sigma-${SIGMA_VERSION_NAME}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: sigma-android
          path: out/
          if-no-files-found: error
